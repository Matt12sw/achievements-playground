<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#F2CC60"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#F2CC60" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F2CC60" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" stroke="#30363D" stroke-width="2"/>

  <!-- Subtle grid dots -->
  <g fill="#30363D" opacity="0.5">
    <circle cx="60" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="140" cy="50" r="2"/>
    <circle cx="60" cy="90" r="2"/><circle cx="100" cy="90" r="2"/><circle cx="140" cy="90" r="2"/>
    <circle cx="1060" cy="210" r="2"/><circle cx="1100" cy="210" r="2"/><circle cx="1140" cy="210" r="2"/>
    <circle cx="1060" cy="250" r="2"/><circle cx="1100" cy="250" r="2"/><circle cx="1140" cy="250" r="2"/>
  </g>

  <!-- Accent line -->
  <rect x="440" y="72" width="320" height="4" rx="2" fill="url(#accent)"/>

  <!-- Main title -->
  <text x="600" y="142" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">
    GitHub Achievements Toolkit
  </text>

  <!-- Subtitle -->
  <text x="600" y="188" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400">
    Practical Guide, PowerShell &amp; Bash Scripts to Understand and Unlock Profile Badges
  </text>

  <!-- Pill badges -->
  <g transform="translate(345, 218)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#1F2937" stroke="#30363D"/>
    <text x="75" y="22" text-anchor="middle" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">PowerShell &amp; Bash</text>

    <rect x="170" y="0" width="170" height="34" rx="17" fill="#1F2937" stroke="#30363D"/>
    <text x="255" y="22" text-anchor="middle" fill="#A371F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">REST &amp; GraphQL API</text>

    <rect x="360" y="0" width="150" height="34" rx="17" fill="#1F2937" stroke="#30363D"/>
    <text x="435" y="22" text-anchor="middle" fill="#F2CC60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">EN / FR Guide</text>
  </g>
</svg>
